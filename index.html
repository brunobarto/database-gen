<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Performance — Bauhaus</title>
<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;800;900&display=swap)" rel="stylesheet">
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js)"></script>
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js)"></script>
<style>
:root{
  --bg:#f2ede3;--fg:#111;--card:#fffdf8;--muted:#6b6b6b;--line:#111;
  --accent:#e63922;--blue:#1f4e9c;--yellow:#f2b705;--neg:#c0392b;
  --cur:auto;
}
[data-theme="dark"]{
  --bg:#0c0c0e;--fg:#f2ede3;--card:#151518;--muted:#9b9b9b;--line:#f2ede3;
  --blue:#4f7fd6;--yellow:#f5c431;
}
*{box-sizing:border-box;margin:0;padding:0;cursor:var(--cur)!important}
html{scroll-behavior:smooth}
body{font-family:'Inconsolata',monospace;background:var(--bg);color:var(--fg);transition:background .5s,color .5s;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
main,header.top{position:relative;z-index:1}

/* progress */
#progress{position:fixed;top:0;left:0;height:4px;background:var(--accent);z-index:50;width:0}

/* loader */
#loader{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .7s,visibility .7s}
#loader.done{opacity:0;visibility:hidden}
.ld-shapes{display:flex;gap:14px}
.ld-shapes span{width:34px;height:34px;animation:bob 1s infinite alternate}
.ld-shapes span:nth-child(1){background:var(--accent);border-radius:50%}
.ld-shapes span:nth-child(2){background:var(--blue);animation-delay:.2s}
.ld-shapes span:nth-child(3){width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:34px solid var(--yellow);animation-delay:.4s}
@keyframes bob{to{transform:translateY(-12px)}}
.battery{display:flex;align-items:center}
.cells{display:flex;gap:4px;padding:6px;border:4px solid var(--line);width:min(420px,80vw)}
.cells i{flex:1;height:34px;background:transparent;transition:background .15s}
.cells i.on{background:var(--accent)}
.cap{width:10px;height:22px;background:var(--line)}
#ld-pct{font-size:2.4rem;font-weight:900;letter-spacing:.1em}

/* top bar */
header.top{position:fixed;top:4px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 4vw;z-index:40;backdrop-filter:blur(6px)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.2rem;letter-spacing:.15em}
.logo b{width:16px;height:16px;background:var(--accent);display:inline-block}
.logo b:nth-child(2){border-radius:50%;background:var(--blue)}
.controls{display:flex;gap:10px;align-items:center}
.btn{font-family:inherit;font-weight:800;font-size:.85rem;background:var(--card);color:var(--fg);border:3px solid var(--line);padding:7px 12px;letter-spacing:.08em;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--accent)}
.lang span{opacity:.35}.lang span.act{opacity:1;color:var(--accent)}
.theme svg{width:18px;height:18px;display:block}
.theme .moon{display:none}[data-theme="dark"] .theme .sun{display:none}[data-theme="dark"] .theme .moon{display:block}
.accent{position:relative}
.swatches{position:absolute;right:0;top:120%;display:none;gap:6px;padding:10px;background:var(--card);border:3px solid var(--line)}
.swatches.open{display:flex}
.swatches button{width:26px;height:26px;border:3px solid var(--line)}
.swatches input{width:30px;height:30px;border:none;background:none;padding:0}
.dot{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--line)}

/* sections */
section{min-height:100vh;padding:120px 6vw 60px;display:flex;flex-direction:column;justify-content:center;position:relative}
.reveal{opacity:0;transform:translateY(50px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.num{font-size:.85rem;font-weight:800;color:var(--accent);letter-spacing:.3em}
h1{font-size:clamp(2.6rem,8vw,6.5rem);font-weight:900;line-height:.92;letter-spacing:-.02em;margin:12px 0 20px}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:clamp(1.8rem,4vw,3rem);font-weight:900;margin:8px 0 24px;display:flex;align-items:center;gap:14px}
.sub{max-width:520px;color:var(--muted);font-size:1.1rem}
.hero-actions{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
.btn.primary{background:var(--accent);color:#fff;font-size:1rem;padding:14px 22px}
#cols{margin-top:18px;font-size:.85rem;color:var(--muted)}
.geo{position:absolute;pointer-events:none;opacity:.9}
.g-circle{width:28vw;height:28vw;max-width:380px;max-height:380px;border-radius:50%;background:var(--accent);right:6vw;top:22vh}
.g-square{width:14vw;height:14vw;max-width:180px;max-height:180px;background:var(--blue);right:24vw;top:52vh;mix-blend-mode:multiply}
[data-theme="dark"] .g-square{mix-blend-mode:screen}
.g-tri{width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-bottom:120px solid var(--yellow);right:8vw;top:64vh}
.g-bar{height:14px;width:40vw;background:var(--line);left:0;bottom:8vh}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:4px solid var(--line)}
.kpi{padding:30px 24px;border-right:4px solid var(--line);background:var(--card);position:relative}
.kpi:last-child{border-right:none}
.kpi small{font-weight:800;letter-spacing:.2em;color:var(--muted);font-size:.75rem}
.kpi strong{display:block;font-size:clamp(1.8rem,3.4vw,2.8rem);font-weight:900;margin-top:10px}
.kpi::after{content:"";position:absolute;top:0;right:0;width:22px;height:22px;background:var(--accent)}
.kpi:nth-child(2)::after{background:var(--blue);border-radius:50%}
.kpi:nth-child(3)::after{background:var(--yellow);clip-path:polygon(50% 0,100% 100%,0 100%)}
.kpi:nth-child(4)::after{background:var(--line)}

/* chart cards */
.card{background:var(--card);border:4px solid var(--line);padding:24px;box-shadow:12px 12px 0 var(--accent);transition:box-shadow .4s}
.chart-box{position:relative;height:min(58vh,480px)}
.info{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);background:var(--yellow);color:#111;font-family:inherit;font-weight:900;font-size:1.1rem;flex-shrink:0;transition:transform .2s}
.info:hover{transform:rotate(20deg) scale(1.1)}
.na{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-weight:800;color:var(--muted);text-align:center;padding:20px}
.na.show{display:flex}

/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.3s}
#modal.open{opacity:1;visibility:visible}
.mwin{background:var(--card);border:4px solid var(--line);width:min(520px,90vw);box-shadow:14px 14px 0 var(--accent);transform:scale(.85) rotate(-2deg);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
#modal.open .mwin{transform:none}
.mbar{display:flex;justify-content:space-between;align-items:center;background:var(--line);color:var(--bg);padding:8px 14px;font-weight:800;letter-spacing:.1em}
.mbar .shapes{display:flex;gap:6px}.mbar .shapes i{width:12px;height:12px;background:var(--accent)}
.mbar .shapes i:nth-child(2){background:var(--blue);border-radius:50%}.mbar .shapes i:nth-child(3){background:var(--yellow)}
.mbar button{background:none;border:none;color:var(--bg);font-family:inherit;font-size:1.3rem;font-weight:900}
.mbody{padding:24px;line-height:1.55;font-size:1.05rem}
.mbody h3{font-size:1.5rem;margin-bottom:10px}
.mbody .ins{margin-top:16px;padding:12px 14px;border-left:8px solid var(--accent);background:rgba(127,127,127,.08);font-weight:600}
footer{padding:40px 6vw;font-size:.8rem;color:var(--muted);position:relative;z-index:1;border-top:4px solid var(--line)}
#drop{position:fixed;inset:0;z-index:95;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;font-size:2.5rem;font-weight:900;opacity:.92}
#drop.show{display:flex}
@media(max-width:700px){.geo{opacity:.25}.kpi{border-right:none;border-bottom:4px solid var(--line)}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="progress"></div>
<div id="drop" data-i18n="drop"></div>

<!-- LOADER -->
<div id="loader">
  <div class="ld-shapes"><span></span><span></span><span></span></div>
  <div class="battery"><div class="cells" id="cells"></div><div class="cap"></div></div>
  <div id="ld-pct">0%</div>
</div>

<header class="top">
  <div class="logo"><b></b><b></b>SALES/LAB</div>
  <div class="controls">
    <button class="btn lang" id="langBtn"><span data-l="fr">FR</span> / <span data-l="en">EN</span></button>
    <button class="btn theme" id="themeBtn" aria-label="theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4.5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="accent">
      <button class="btn" id="accentBtn" aria-label="accent"><div class="dot"></div></button>
      <div class="swatches" id="swatches">
        <button style="background:#e63922" data-c="#e63922"></button>
        <button style="background:#1f4e9c" data-c="#1f4e9c"></button>
        <button style="background:#f2b705" data-c="#f2b705"></button>
        <button style="background:#1e9e6a" data-c="#1e9e6a"></button>
        <input type="color" id="colorPick" value="#e63922">
      </div>
    </div>
  </div>
</header>

<main>
  <!-- HERO -->
  <section id="hero">
    <div class="geo g-circle"></div><div class="geo g-square"></div><div class="geo g-tri"></div><div class="geo g-bar"></div>
    <div class="reveal">
      <div class="num">00 — <span data-i18n="tag"></span></div>
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="sub"></p>
      <div class="hero-actions">
        <label class="btn primary" for="file" data-i18n="upload"></label>
        <input type="file" id="file" accept=".csv" hidden>
        <button class="btn" id="sampleBtn" data-i18n="sample"></button>
      </div>
      <p id="cols"></p>
    </div>
  </section>

  <!-- KPIs -->
  <section id="kpi" style="min-height:70vh">
    <div class="reveal">
      <div class="num">01</div>
      <h2 data-i18n="overview"></h2>
      <div class="kpis">
        <div class="kpi"><small data-i18n="kRev"></small><strong id="kRev">—</strong></div>
        <div class="kpi"><small data-i18n="kProfit"></small><strong id="kProfit">—</strong></div>
        <div class="kpi"><small data-i18n="kMargin"></small><strong id="kMargin">—</strong></div>
        <div class="kpi"><small data-i18n="kOrders"></small><strong id="kOrders">—</strong></div>
      </div>
    </div>
  </section>

  <section data-chart="trend"><div class="reveal">
    <div class="num">02</div>
    <h2><span data-i18n="trendT"></span><button class="info" data-info="trend">?</button></h2>
    <div class="card"><div class="chart-box"><canvas id="c-trend"></canvas><div class="na" data-na="trend"></div></div></div>
  </div></section>

  <section data-chart="region"><div class="reveal">
    <div class="num">03</div>
    <h2><span data-i18n="regionT"></span><button class="info" data-info="region">?</button></h2>
    <div class="card"><div class="chart-box"><canvas id="c-region"></canvas><div class="na" data-na="region"></div></div></div>
  </div></section>

  <section data-chart="category"><div class="reveal">
    <div class="num">04</div>
    <h2><span data-i18n="catT"></span><button class="info" data-info="category">?</button></h2>
    <div class="card"><div class="chart-box"><canvas id="c-category"></canvas><div class="na" data-na="category"></div></div></div>
  </div></section>

  <section data-chart="discount"><div class="reveal">
    <div class="num">05</div>
    <h2><span data-i18n="discT"></span><button class="info" data-info="discount">?</button></h2>
    <div class="card"><div class="chart-box"><canvas id="c-discount"></canvas><div class="na" data-na="discount"></div></div></div>
  </div></section>
</main>

<footer data-i18n="foot"></footer>

<!-- MODAL -->
<div id="modal"><div class="mwin">
  <div class="mbar"><div class="shapes"><i></i><i></i><i></i></div><span data-i18n="insight"></span><button id="mClose">✕</button></div>
  <div class="mbody" id="mBody"></div>
</div></div>

<script>
/* ---------- CURSOR: small hand ---------- */
const handSvg=`<svg xmlns='[w3.org](http://www.w3.org/2000/svg)' width='26' height='26' viewBox='0 0 24 24'><path d='M9 11V4.5a1.5 1.5 0 0 1 3 0V10h.5V8.5a1.5 1.5 0 0 1 3 0V10h.5V9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.2a6 6 0 0 1-4.6-2.2L4.6 15.6a1.5 1.5 0 0 1 2.3-1.9L9 16z' fill='white' stroke='black' stroke-width='1.4' stroke-linejoin='round'/></svg>`;
document.documentElement.style.setProperty('--cur',`url("data:image/svg+xml,${encodeURIComponent(handSvg)}") 9 2, pointer`);

/* ---------- I18N ---------- */
const T={
 en:{tag:"SALES PERFORMANCE ANALYSIS",title:"Read your<br><em>sales</em> in<br>shapes.",sub:"Drop any CSV. Trends, regions, categories and discount impact — computed instantly in your browser.",
  upload:"↑ Upload CSV",sample:"Sample data",overview:"Overview",kRev:"REVENUE",kProfit:"PROFIT",kMargin:"MARGIN",kOrders:"ORDERS",
  trendT:"Sales trend",regionT:"Regional performance",catT:"Sales & profit by category",discT:"Discount impact on profit",
  sales:"Sales",profit:"Profit",margin:"Profit margin",orders:"Orders",avgTicket:"Avg. sale",insight:"INSIGHT",drop:"Drop your CSV",
  detected:"Detected columns",rows:"rows",none:"not found",na:"Column not available in this file",
  naProfit:"Profit column missing — showing average sale per discount level",
  foot:"SALES/LAB — data never leaves your browser.",
  info:{trend:["Sales trend","Monthly total sales (and profit when available). Rising lines mean growth; dips reveal seasonality or slow periods. Click a point for details."],
   region:["Regional performance","Total sales per region/city, ranked. It shows where revenue concentrates and which markets lag behind."],
   category:["Category sales & profit","Compares how much each category sells versus how much it actually earns. A tall sales bar with a small profit bar signals a low-margin category."],
   discount:["Discount impact","Average profit margin for each discount level. Bars falling below zero show discounts that destroy profitability."]},
  ins:{trend:(b,w,g)=>`Best month: <b>${b}</b>. Weakest: <b>${w}</b>. Overall change first→last month: <b>${g}</b>.`,
   region:(t,s)=>`<b>${t}</b> leads with <b>${s}</b> of total sales.`,
   category:(t,m)=>`<b>${t}</b> sells the most. Best margin: <b>${m}</b>.`,
   discount:(z,h)=>`Margin with no discount: <b>${z}</b>. At the highest discount level: <b>${h}</b>.`},
  share:"share of total"},
 fr:{tag:"ANALYSE DES PERFORMANCES COMMERCIALES",title:"Lisez vos<br><em>ventes</em> en<br>formes.",sub:"Déposez n'importe quel CSV. Tendances, régions, catégories et impact des remises — calculés instantanément dans votre navigateur.",
  upload:"↑ Charger un CSV",sample:"Données d'exemple",overview:"Vue d'ensemble",kRev:"CHIFFRE D'AFFAIRES",kProfit:"BÉNÉFICE",kMargin:"MARGE",kOrders:"COMMANDES",
  trendT:"Tendance des ventes",regionT:"Performance régionale",catT:"Ventes & bénéfice par catégorie",discT:"Impact des remises sur le bénéfice",
  sales:"Ventes",profit:"Bénéfice",margin:"Marge bénéficiaire",orders:"Commandes",avgTicket:"Vente moyenne",insight:"ANALYSE",drop:"Déposez votre CSV",
  detected:"Colonnes détectées",rows:"lignes",none:"absente",na:"Colonne absente de ce fichier",
  naProfit:"Colonne bénéfice absente — vente moyenne par niveau de remise",
  foot:"SALES/LAB — vos données ne quittent jamais votre navigateur.",
  info:{trend:["Tendance des ventes","Ventes totales par mois (et bénéfice si disponible). Une courbe montante indique une croissance ; les creux révèlent la saisonnalité. Cliquez un point pour le détail."],
   region:["Performance régionale","Ventes totales par région/ville, classées. Montre où se concentre le chiffre d'affaires et quels marchés sont en retrait."],
   category:["Ventes & bénéfice par catégorie","Compare ce que chaque catégorie vend et ce qu'elle rapporte réellement. Une grande barre de ventes avec un petit bénéfice signale une faible marge."],
   discount:["Impact des remises","Marge bénéficiaire moyenne par niveau de remise. Les barres sous zéro montrent les remises qui détruisent la rentabilité."]},
  ins:{trend:(b,w,g)=>`Meilleur mois : <b>${b}</b>. Plus faible : <b>${w}</b>. Évolution premier→dernier mois : <b>${g}</b>.`,
   region:(t,s)=>`<b>${t}</b> domine avec <b>${s}</b> des ventes totales.`,
   category:(t,m)=>`<b>${t}</b> vend le plus. Meilleure marge : <b>${m}</b>.`,
   discount:(z,h)=>`Marge sans remise : <b>${z}</b>. Au niveau de remise le plus élevé : <b>${h}</b>.`},
  share:"part du total"}
};
let lang='fr';
const t=k=>T[lang][k];
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t(el.dataset.i18n));
  document.querySelectorAll('.lang span').forEach(s=>s.classList.toggle('act',s.dataset.l===lang));
  if(D){fillKPIs();showCols();rerender();}
}
document.getElementById('langBtn').onclick=()=>{lang=lang==='fr'?'en':'fr';applyLang();};

/* ---------- THEME & ACCENT ---------- */
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';setTimeout(rerender,60);
};
const sw=document.getElementById('swatches');
document.getElementById('accentBtn').onclick=e=>{e.stopPropagation();sw.classList.toggle('open');};
document.addEventListener('click',e=>{if(!sw.contains(e.target))sw.classList.remove('open');});
function setAccent(c){document.documentElement.style.setProperty('--accent',c);rerender();}
sw.querySelectorAll('button').forEach(b=>b.onclick=()=>setAccent(b.dataset.c));
document.getElementById('colorPick').oninput=e=>setAccent(e.target.value);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- STARS ---------- */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');
let W,H,stars=[],mx=-999,my=-999;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  stars=Array.from({length:Math.min(220,W*H/7000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,ox:0,oy:0}));}
addEventListener('resize',size);size();
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function loop(){
  cx.clearRect(0,0,W,H);const col=css('--fg');cx.fillStyle=col;
  const px=(mx-W/2)/W,py=(my-H/2)/H;
  for(const s of stars){
    s.x+=s.vx;s.y+=s.vy;
    if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;
    const dx=s.x+s.ox-mx,dy=s.y+s.oy-my,d=Math.hypot(dx,dy);
    if(d<130){const f=(130-d)/130*3;s.ox+=dx/d*f;s.oy+=dy/d*f;}
    s.ox*=.94;s.oy*=.94;
    const x=s.x+s.ox-px*s.r*14,y=s.y+s.oy-py*s.r*14;
    cx.globalAlpha=.25+s.r*.3;
    s.r>1.3?cx.fillRect(x-s.r,y-s.r,s.r*2,s.r*2):(cx.beginPath(),cx.arc(x,y,s.r,0,7),cx.fill());
  }
  requestAnimationFrame(loop);
})();

/* ---------- LOADER ---------- */
const cells=document.getElementById('cells');for(let i=0;i<20;i++)cells.appendChild(document.createElement('i'));
let pct=0;const ld=setInterval(()=>{
  pct=Math.min(100,pct+Math.random()*7+2);
  document.getElementById('ld-pct').textContent=Math.floor(pct)+'%';
  [...cells.children].forEach((c,i)=>c.classList.toggle('on',i<Math.round(pct/5)));
  if(pct>=100){clearInterval(ld);setTimeout(()=>{document.getElementById('loader').classList.add('done');document.querySelector('#hero .reveal').classList.add('in');},350);}
},90);

/* ---------- SCROLL ---------- */
addEventListener('scroll',()=>{const h=document.documentElement;document.getElementById('progress').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
  document.querySelectorAll('.geo').forEach((g,i)=>g.style.transform=`translateY(${scrollY*(i+1)*-.12}px) rotate(${scrollY*.03*(i%2?1:-1)}deg)`);});
const visible=new Set();
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;
  e.target.querySelector('.reveal')?.classList.add('in');
  const k=e.target.dataset.chart;if(k&&!visible.has(k)){visible.add(k);draw(k);}
  if(e.target.id==='kpi')animateKPIs();
}),{threshold:.25});
document.querySelectorAll('section').forEach(s=>io.observe(s));

/* ---------- DATA ---------- */
let D=null,COLS=null;
function detect(headers){
  const h=headers.map(o=>({o,l:String(o).toLowerCase().trim()}));
  const find=(keys,ex=[])=>{for(const k of keys){const m=h.find(c=>c.l===k);if(m)return m.o}
    for(const k of keys){const m=h.find(c=>c.l.includes(k)&&!ex.some(e=>c.l.includes(e)));if(m)return m.o}return null};
  return{date:find(['order date','date','month','mois','period'],['ship','id']),
    sales:find(['sales','revenue','vente','ventes','chiffre','amount','montant','turnover'],['id','qty','quantity','count']),
    profit:find(['profit','bénéfice','benefice','marge','margin']),
    discount:find(['discount','remise','réduction','reduction']),
    region:find(['region','région','city','ville','state','country','pays','market'],['id']),
    category:find(['category','catégorie','categorie','segment','product','produit'],['id']),
    qty:find(['quantity ordered','quantity','qty','quantité']),
    price:find(['price each','unit price','price','prix']),
    order:find(['order id','invoice','commande','order'],['date','priority'])};
}
const num=v=>typeof v==='number'?v:parseFloat(String(v??'').replace(/\s/g,'').replace(/,(\d{1,2})$/,'.$1').replace(/[^0-9.\-]/g,''));
function monthKey(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&v>=1&&v<=12)return 'M'+String(v).padStart(2,'0');
  let d=new Date(v);
  if(isNaN(d)){const m=String(v).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m)d=new Date(+(m[3].length===2?'20'+m[3]:m[3]),m[2]-1,m[1]);}
  if(isNaN(d))return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
const BINS=[[0,0],[0.0001,.1],[.1,.2],[.2,.3],[.3,.5],[.5,1.01]],BLAB=['0%','1–10%','10–20%','20–30%','30–50%','50%+'];
function analyze(rows,c){
  const A={sales:0,profit:0,orders:new Set(),n:0,month:{},region:{},cat:{},disc:BINS.map(()=>({s:0,p:0,n:0})),hasP:!!c.profit,hasD:!!c.discount};
  for(const r of rows){
    let s=c.sales?num(r[c.sales]):NaN;
    if(!isFinite(s)&&c.price&&c.qty)s=num(r[c.price])*num(r[c.qty]);
    if(!isFinite(s))continue;
    const p=c.profit?num(r[c.profit]):0;const pf=isFinite(p)?p:0;
    A.sales+=s;A.profit+=pf;A.n++;
    A.orders.add(c.order?r[c.order]:A.n);
    const m=c.date&&monthKey(r[c.date]);if(m){(A.month[m]??={s:0,p:0});A.month[m].s+=s;A.month[m].p+=pf;}
    const rg=c.region&&r[c.region];if(rg){A.region[rg]=(A.region[rg]||0)+s;}
    const ct=c.category&&r[c.category];if(ct){(A.cat[ct]??={s:0,p:0});A.cat[ct].s+=s;A.cat[ct].p+=pf;}
    if(c.discount){let d=num(r[c.discount]);if(isFinite(d)){if(d>1)d/=100;
      const i=d<=0?0:BINS.findIndex(([a,b],j)=>j>0&&d>=a&&d<b);if(i>=0){A.disc[i].s+=s;A.disc[i].p+=pf;A.disc[i].n++;}}}
  }
  return A;
}
function load(rows,fields){COLS=detect(fields);D=analyze(rows,COLS);
  fillKPIs();showCols();kpiDone=false;
  if(document.getElementById('kpi').getBoundingClientRect().top<innerHeight)animateKPIs();
  rerender();}
function showCols(){if(!COLS)return;
  const lab={date:'date',sales:t('sales'),profit:t('profit'),discount:'discount',region:'region',category:'category'};
  document.getElementById('cols').innerHTML=`▪ ${t('detected')} (${D.n.toLocaleString()} ${t('rows')}) : `+Object.keys(lab).map(k=>`${lab[k]} → <b>${COLS[k]||'<s>'+t('none')+'</s>'}</b>`).join(' · ');}

/* sample */
function sample(){
  const regs=['West','East','Central','South','North'],cats=['Technology','Furniture','Office Supplies','Accessories','Software'],rows=[];
  for(let i=0;i<2400;i++){
    const d=new Date(2025,Math.floor(Math.random()*12)+(Math.random()<.5?0:12),1+Math.floor(Math.random()*27));
    if(d>new Date(2026,9,1))continue;
    const c=cats[Math.floor(Math.random()**1.4*5)],base={Technology:420,Furniture:350,'Office Supplies':90,Accessories:120,Software:260}[c];
    const season=1+.35*Math.sin((d.getMonth()-2)/12*6.28)+(d.getFullYear()-2025)*.18;
    const disc=[0,0,0,.1,.2,.2,.3,.4,.5,.7][Math.floor(Math.random()*10)];
    const s=base*season*(.4+Math.random()*1.4)*(1-disc*.3);
    const mBase={Technology:.2,Furniture:.06,'Office Supplies':.17,Accessories:.24,Software:.3}[c];
    rows.push({'Order ID':'O'+(1000+Math.floor(i/1.6)),'Order Date':d.toISOString().slice(0,10),Region:regs[Math.floor(Math.random()**1.25*5)],Category:c,Sales:+s.toFixed(2),Discount:disc,Profit:+(s*(mBase-disc*.75+(Math.random()-.5)*.1)).toFixed(2)});
  }
  load(rows,Object.keys(rows[0]));
}
document.getElementById('sampleBtn').onclick=sample;

/* file + drag & drop */
function parse(file){Papa.parse(file,{header:true,dynamicTyping:true,skipEmptyLines:true,complete:r=>{load(r.data,r.meta.fields);document.getElementById('kpi').scrollIntoView();}});}
document.getElementById('file').onchange=e=>e.target.files[0]&&parse(e.target.files[0]);
const drop=document.getElementById('drop');
addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('show');});
drop.addEventListener('dragleave',()=>drop.classList.remove('show'));
addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('show');const f=e.dataTransfer.files[0];f&&parse(f);});

/* ---------- FORMAT ---------- */
const loc=()=>lang==='fr'?'fr-FR':'en-US';
const money=v=>new Intl.NumberFormat(loc(),{notation:Math.abs(v)>=1e5?'compact':'standard',maximumFractionDigits:Math.abs(v)>=1e5?1:0}).format(v);
const pctf=v=>isFinite(v)?(v*100).toFixed(1)+'%':'—';
function mLabel(k){if(k.startsWith('M'))return new Date(2000,+k.slice(1)-1).toLocaleString(loc(),{month:'short'});
  const[y,m]=k.split('-');return new Date(y,m-1).toLocaleString(loc(),{month:'short',year:'2-digit'});}

/* ---------- KPIs ---------- */
let kpiDone=false;
function kpiVals(){return{kRev:[D.sales,money],kProfit:[D.hasP?D.profit:NaN,money],kMargin:[D.hasP?D.profit/D.sales:NaN,pctf],kOrders:[D.orders.size,v=>Math.round(v).toLocaleString(loc())]};}
function fillKPIs(){if(!D)return;const v=kpiVals();for(const k in v)document.getElementById(k).textContent=isFinite(v[k][0])?v[k][1](v[k][0]):'—';}
function animateKPIs(){if(!D||kpiDone)return;kpiDone=true;const v=kpiVals(),t0=performance.now();
  (function step(n){const p=Math.min(1,(n-t0)/1400),e=1-Math.pow(1-p,3);
    for(const k in v)if(isFinite(v[k][0]))document.getElementById(k).textContent=v[k][1](v[k][0]*e);
    p<1&&requestAnimationFrame(step);})(t0);}

/* ---------- CHARTS ---------- */
Chart.defaults.font.family="'Inconsolata',monospace";Chart.defaults.font.size=14;
const charts={};
function rerender(){visible.forEach(draw);document.querySelector('.card')&&0;}
function base(){
  const fg=css('--fg'),grid=document.documentElement.dataset.theme==='dark'?'rgba(255,255,255,.08)':'rgba(0,0,0,.08)';
  Chart.defaults.color=fg;
  return{responsive:true,maintainAspectRatio:false,animation:{duration:1400,easing:'easeOutQuart'},
    plugins:{legend:{labels:{boxWidth:14,font:{weight:'800'}}},tooltip:{backgroundColor:fg,titleColor:css('--bg'),bodyColor:css('--bg'),cornerRadius:0,padding:10,titleFont:{weight:'800'}}},
    scales:{x:{grid:{color:grid},border:{color:fg,width:3}},y:{grid:{color:grid},border:{color:fg,width:3},ticks:{callback:v=>money(v)}}}};
}
function na(k,msg){const el=document.querySelector(`[data-na="${k}"]`);el.textContent=msg||'';el.classList.toggle('show',!!msg);}
function make(k,cfg,onPick){
  charts[k]?.destroy();
  cfg.options.onClick=(e,els)=>{if(els.length)onPick(els[0].index,els[0].datasetIndex);};
  cfg.options.onHover=(e,els)=>{e.native.target.style.cursor='';};
  charts[k]=new Chart(document.getElementById('c-'+k),cfg);
}
function draw(k){
  if(!D)return;const A=css('--accent'),B=css('--blue'),Y=css('--yellow'),fg=css('--fg'),o=base();
  if(k==='trend'){
    const keys=Object.keys(D.month).sort();
    if(!keys.length){charts.trend?.destroy();return na('trend',t('na'));}na('trend');
    const ds=[{label:t('sales'),data:keys.map(m=>D.month[m].s),borderColor:A,backgroundColor:A+'33',fill:true,borderWidth:4,pointStyle:'rect',pointRadius:6,pointBackgroundColor:A,tension:0,stepped:false}];
    if(D.hasP)ds.push({label:t('profit'),data:keys.map(m=>D.month[m].p),borderColor:B,borderWidth:3,pointStyle:'circle',pointRadius:5,pointBackgroundColor:B,borderDash:[8,6]});
    o.animation={x:{type:'number',easing:'linear',duration:60,from:NaN,delay:c=>c.index*60}};
    make('trend',{type:'line',data:{labels:keys.map(mLabel),datasets:ds},options:o},i=>{
      const m=D.month[keys[i]];popup(mLabel(keys[i]),`${t('sales')}: <b>${money(m.s)}</b>`+(D.hasP?`<br>${t('profit')}: <b>${money(m.p)}</b><br>${t('margin')}: <b>${pctf(m.p/m.s)}</b>`:''),`${pctf(m.s/D.sales)} ${t('share')}`);});
  }
  if(k==='region'){
    const e=Object.entries(D.region).sort((a,b)=>b[1]-a[1]).slice(0,10);
    if(!e.length){charts.region?.destroy();return na('region',t('na'));}na('region');
    o.indexAxis='y';o.scales.x.ticks={callback:v=>money(v)};o.scales.y.ticks={};o.plugins.legend.display=false;
    o.animation={delay:c=>c.dataIndex*90,duration:1000};
    make('region',{type:'bar',data:{labels:e.map(x=>x[0]),datasets:[{label:t('sales'),data:e.map(x=>x[1]),backgroundColor:e.map((_,i)=>[A,B,Y][i%3]),borderColor:fg,borderWidth:3,borderSkipped:false}]},options:o},
      i=>popup(e[i][0],`${t('sales')}: <b>${money(e[i][1])}</b><br>#${i+1}`,`${pctf(e[i][1]/D.sales)} ${t('share')}`));
  }
  if(k==='category'){
    const e=Object.entries(D.cat).sort((a,b)=>b[1].s-a[1].s).slice(0,8);
    if(!e.length){charts.category?.destroy();return na('category',t('na'));}na('category');
    const ds=[{label:t('sales'),data:e.map(x=>x[1].s),backgroundColor:A,borderColor:fg,borderWidth:3}];
    if(D.hasP)ds.push({label:t('profit'),data:e.map(x=>x[1].p),backgroundColor:Y,borderColor:fg,borderWidth:3});
    o.animation={delay:c=>c.dataIndex*120+c.datasetIndex*300};
    make('category',{type:'bar',data:{labels:e.map(x=>x[0]),datasets:ds},options:o},i=>{
      const c=e[i][1];popup(e[i][0],`${t('sales')}: <b>${money(c.s)}</b>`+(D.hasP?`<br>${t('profit')}: <b>${money(c.p)}</b><br>${t('margin')}: <b>${pctf(c.p/c.s)}</b>`:''),`${pctf(c.s/D.sales)} ${t('share')}`);});
  }
  if(k==='discount'){
    if(!D.hasD){charts.discount?.destroy();return na('discount',t('na'));}
    const idx=D.disc.map((b,i)=>b.n?i:-1).filter(i=>i>=0);
    const vals=idx.map(i=>D.hasP?D.disc[i].p/D.disc[i].s:D.disc[i].s/D.disc[i].n);
    na('discount');
    o.plugins.legend.display=false;
    if(D.hasP)o.scales.y.ticks={callback:v=>(v*100).toFixed(0)+'%'};
    o.animation={delay:c=>c.dataIndex*140,duration:1100};
    make('discount',{type:'bar',data:{labels:idx.map(i=>BLAB[i]),datasets:[{label:D.hasP?t('margin'):t('avgTicket'),data:vals,
      backgroundColor:vals.map(v=>v<0?css('--neg'):B),borderColor:fg,borderWidth:3}]},options:o},
      j=>{const b=D.disc[idx[j]];popup(BLAB[idx[j]],`${t('orders')}: <b>${b.n.toLocaleString(loc())}</b><br>${t('sales')}: <b>${money(b.s)}</b>`+(D.hasP?`<br>${t('profit')}: <b>${money(b.p)}</b><br>${t('margin')}: <b>${pctf(b.p/b.s)}</b>`:''),'');});
    if(!D.hasP)na('discount',''),document.querySelector('[data-na="discount"]').classList.remove('show');
  }
}

/* ---------- MODAL ---------- */
const modal=document.getElementById('modal');
function popup(title,body,ins){document.getElementById('mBody').innerHTML=`<h3>${title}</h3><p>${body}</p>${ins?`<div class="ins">${ins}</div>`:''}`;modal.classList.add('open');}
document.getElementById('mClose').onclick=()=>modal.classList.remove('open');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open');};
addEventListener('keydown',e=>e.key==='Escape'&&modal.classList.remove('open'));
document.querySelectorAll('.info').forEach(b=>b.onclick=()=>{
  const k=b.dataset.info,[ti,tx]=t('info')[k];let ins='';
  if(D){const I=t('ins');
    if(k==='trend'){const ks=Object.keys(D.month).sort();if(ks.length>1){const s=[...ks].sort((a,b)=>D.month[b].s-D.month[a].s);
      ins=I.trend(mLabel(s[0]),mLabel(s.at(-1)),pctf(D.month[ks.at(-1)].s/D.month[ks[0]].s-1));}}
    if(k==='region'){const e=Object.entries(D.region).sort((a,b)=>b[1]-a[1]);if(e.length)ins=I.region(e[0][0],pctf(e[0][1]/D.sales));}
    if(k==='category'){const e=Object.entries(D.cat);if(e.length){const top=[...e].sort((a,b)=>b[1].s-a[1].s)[0][0];
      const m=D.hasP?[...e].sort((a,b)=>b[1].p/b[1].s-a[1].p/a[1].s)[0]:null;ins=I.category(top,m?`${m[0]} (${pctf(m[1].p/m[1].s)})`:'—');}}
    if(k==='discount'&&D.hasD&&D.hasP){const f=D.disc.filter(b=>b.n);if(f.length)ins=I.discount(pctf(f[0].p/f[0].s),pctf(f.at(-1).p/f.at(-1).s));}
    if(k==='discount'&&D.hasD&&!D.hasP)ins=t('naProfit');
  }
  popup(ti,tx,ins);
});

/* ---------- INIT ---------- */
applyLang();sample();
</script>
